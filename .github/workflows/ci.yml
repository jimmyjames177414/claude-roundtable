name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      - run: npm run build
      - run: npm test

  # vitest 4's bundled rolldown dependency needs node:util's styleText, which doesn't
  # exist before Node 20 - that's a test-tooling limit, not a product one. tsup builds
  # for target node18, so this job verifies the actual engines:>=18 promise by building
  # and smoke-running the real binary on 18, without needing vitest to run there.
  minimum-node-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 18
      - run: npm ci
      - run: npm run build
      - run: node dist/index.js --version
